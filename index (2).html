<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Sklep Internetowy</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #f0f0f0;
    }
    h1 { color: #ffffff; }
    button {
      padding: 12px 16px;
      margin: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      background-color: #0070f3;
      color: white;
    }
    button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <h1>Sklep Internetowy</h1>

  <button onclick="window.location.href='https://ptoszek.pl'">Prawda</button>
  <button onclick="window.location.href='https://brawo-wygrałeś.pl'">Fałsz</button>

</body>
</html>
